name: Sync Firefox Android release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-official-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: fenix
  UPSTREAM_REPOSITORY: https://github.com/mozilla-firefox/firefox.git

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      baseline: ${{ steps.release.outputs.baseline }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      has_update: ${{ steps.release.outputs.has_update }}
    steps:
      - name: Find the latest Firefox Android release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/FENIX_UPSTREAM_RELEASE?ref=$BASE_BRANCH" \
            --jq .content | base64 --decode | tr -d '\r\n')"
          git ls-remote --tags "$UPSTREAM_REPOSITORY" > "$RUNNER_TEMP/firefox-android-tags.txt"
          python3 - "$baseline" "$GITHUB_OUTPUT" "$RUNNER_TEMP/firefox-android-tags.txt" <<'PY'
          import re
          import sys

          baseline, output_path, tag_path = sys.argv[1:]
          release_pattern = re.compile(
              r"^FIREFOX-ANDROID_(\d+)_(\d+)(?:_(\d+))?_RELEASE$"
          )

          def version_tuple(version):
              parts = tuple(int(part) for part in version.split("."))
              return parts + (0,) * (3 - len(parts))

          releases = {}
          with open(tag_path, encoding="utf-8") as tags:
              for line in tags:
                  ref = line.rstrip().split("\t", 1)[-1]
                  if not ref.startswith("refs/tags/") or ref.endswith("^{}"):
                      continue
                  tag = ref.removeprefix("refs/tags/")
                  match = release_pattern.fullmatch(tag)
                  if not match:
                      continue
                  major, minor, patch = match.groups()
                  version = f"{major}.{minor}"
                  if patch is not None:
                      version += f".{patch}"
                  releases[version] = tag

          if not releases:
              raise SystemExit("No Firefox Android release tags were found")

          latest = max(releases, key=version_tuple)
          is_update = version_tuple(latest) > version_tuple(baseline)
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"baseline={baseline}\n")
              output.write(f"version={latest}\n")
              output.write(f"tag={releases[latest]}\n")
              output.write(f"has_update={'true' if is_update else 'false'}\n")
          print(f"Fenix baseline: {baseline}; latest Firefox Android release: {latest}")
          if not is_update:
              print("No newer Firefox Android release found.")
          PY

  sync:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fenix
        uses: actions/checkout@v4
        with:
          ref: fenix
          fetch-depth: 1

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git switch --force-create "$BASE_BRANCH" "origin/$BASE_BRANCH"

      - name: Check for an existing synchronization PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: automation/firefox-android-${{ needs.check.outputs.version }}
        shell: bash
        run: |
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$CANDIDATE_BRANCH" \
            --json number,url \
            --jq '.[0]')"
          if [ -n "$existing" ]; then
            echo "already_open=true" >> "$GITHUB_OUTPUT"
            echo "A synchronization PR is already open: $existing"
          else
            echo "already_open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge existing synchronization PR
        if: steps.existing.outputs.already_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: automation/firefox-android-${{ needs.check.outputs.version }}
        shell: bash
        run: |
          pr_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$CANDIDATE_BRANCH" \
            --json url \
            --jq '.[0].url')"
          candidate_sha="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          gh pr merge "$pr_url" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$candidate_sha"

      - name: Prepare and merge synchronization PR
        if: steps.existing.outputs.already_open != 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET_TAG: ${{ needs.check.outputs.tag }}
          PREVIOUS_BASELINE: ${{ needs.check.outputs.baseline }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pwsh -NoProfile -File tools/fenix/sync-official-release.ps1 -Version "$VERSION"
          test "$(tr -d '\r\n' < FENIX_UPSTREAM_RELEASE)" = "$VERSION"
          git add FENIX_UPSTREAM_RELEASE

          grep -Fq 'applicationId "github.aenerv7.fenix"' mobile/android/fenix/app/build.gradle
          grep -Fq 'MOZ_APP_DISPLAYNAME=Fenix' mobile/android/branding/fenix/configure.sh
          grep -Fq 'default = CURRENT_ONBOARDING_VERSION' mobile/android/fenix/app/src/main/java/org/mozilla/fenix/onboarding/FenixOnboarding.kt
          grep -Fq 'android:src="@drawable/ic_launcher_foreground"' mobile/android/fenix/app/src/main/res/drawable/ic_splash_logo.xml
          test -s FENIX_PRIVACY_AND_RIGHTS.md
          git diff --check
          git diff --cached --check

          git commit -m "Update Fenix baseline to Firefox Android $VERSION"
          test "$(git rev-parse HEAD^2)" = "$(git rev-parse "${TARGET_TAG}^{}")"
          candidate_branch="automation/firefox-android-$VERSION"
          candidate_sha="$(git rev-parse HEAD)"
          remote_candidate_sha="$(git ls-remote --heads origin "refs/heads/$candidate_branch" | cut -f1)"
          if [ -n "$remote_candidate_sha" ]; then
            git push origin \
              --force-with-lease="refs/heads/$candidate_branch:$remote_candidate_sha" \
              "HEAD:refs/heads/$candidate_branch"
          else
            git push origin "HEAD:refs/heads/$candidate_branch"
          fi

          body="$RUNNER_TEMP/firefox-android-sync-pr.md"
          cat > "$body" <<EOF
          This automated PR synchronizes Fenix with Firefox Android $VERSION.

          Upstream tag: $TARGET_TAG
          Previous baseline: $PREVIOUS_BASELINE
          Candidate commit: $candidate_sha

          The workflow applied the upstream tree delta to the new official tag and passed the Fenix
          application ID, branding, onboarding, privacy-document, and whitespace checks. Android
          APK builds are intentionally separate from this lightweight synchronization check.
          EOF
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$candidate_branch" \
            --title "Update Fenix baseline to Firefox Android $VERSION" \
            --body-file "$body")"
          gh pr merge "$pr_url" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$candidate_sha"
          echo "Merged $pr_url"
